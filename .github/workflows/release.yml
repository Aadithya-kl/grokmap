name: release

# Push a tag like v0.1.0 to publish to PyPI (uses PyPI trusted publishing, no token needed:
# add this repo + workflow as a trusted publisher on pypi.org first).
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: "Move the floating major tag (v0) so `uses: Aadithya-kl/grokmap@v0` gets this release"
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" && git push -f origin "$major"
