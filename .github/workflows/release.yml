name: release

# Push a tag like v0.3.0 (or publish a GitHub release) to ship everything:
#   1. build grokmap and grokmap-mcp
#   2. publish both to PyPI (trusted publishing, no token)
#   3. publish server.json to the official MCP Registry (GitHub OIDC, no token)
#   4. move the floating major tag (v0) used by `uses: Aadithya-kl/grokmap@v0`
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check every version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python - "$tag" <<'PY'
          import json, re, sys, tomllib
          tag = sys.argv[1]
          found = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "packages/grokmap-mcp/pyproject.toml": tomllib.load(open("packages/grokmap-mcp/pyproject.toml", "rb"))["project"]["version"],
              "server.json": json.load(open("server.json"))["version"],
              "server.json packages[0]": json.load(open("server.json"))["packages"][0]["version"],
              "src/grokmap/__init__.py": re.search(r'__version__ = "([^"]+)"', open("src/grokmap/__init__.py").read()).group(1),
          }
          bad = {k: v for k, v in found.items() if v != tag}
          if bad:
              sys.exit(f"version mismatch with tag {tag}: {bad}")
          print("all versions =", tag)
          PY
      - run: python -m pip install build
      - run: |
          python -m build -o dist .
          python -m build -o dist packages/grokmap-mcp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait until PyPI serves grokmap-mcp ${{ github.ref_name }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/grokmap-mcp/$v/json" > /dev/null; then echo "available"; exit 0; fi
            sleep 10
          done
          echo "grokmap-mcp $v did not appear on PyPI in time" && exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish

  major-tag:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Move the floating major tag (v0) so `uses: Aadithya-kl/grokmap@v0` gets this release"
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" && git push -f origin "$major"
