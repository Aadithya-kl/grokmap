name: live demo

# Builds the demo repository, renders its grokmap report and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Check the study page is up to date with its data
        run: |
          python scripts/build_study.py
          git diff --exit-code site/study/index.html
      - name: Build the demo repository and its report
        run: |
          git config --global user.email "demo@example.com"
          git config --global user.name "grokmap demo"
          python scripts/make_demo.py "$RUNNER_TEMP/demo" --with-ledger
          mkdir -p _site/demo
          cp -r site/. _site/
          rm -f _site/study/template.html
          grokmap -C "$RUNNER_TEMP/demo" report -o _site/demo/index.html --name shopcart \
            --note "Live demo of grokmap on a small fake shop written mostly by AI agents. Hover anything; click folders to zoom. github.com/Aadithya-kl/grokmap"
          grokmap -C "$RUNNER_TEMP/demo" badge -o _site/demo/badge.svg
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1