name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q

  dogfood:
    # run the action on this repository itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./
        id: grokmap
      - run: echo "comprehension debt is ${DEBT}%"
        env:
          DEBT: ${{ steps.grokmap.outputs.debt }}

  docker:
    # the image directories such as Glama build to inspect the MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker build -t grokmap-mcp .
      - name: The server answers tools/call inside the container
        run: |
          (printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"repo_status","arguments":{"top":1}}}'; sleep 15) \
            | timeout 60 docker run -i --rm -v "$PWD:/repo" grokmap-mcp > out.jsonl || true
          cat out.jsonl
          grep -q '"id":2' out.jsonl && grep -q 'debt' out.jsonl

  package:
    # builds both packages and hands them to another job, exactly like the release does
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: |
          python -m build -o dist .
          python -m build -o dist packages/grokmap-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  package-install:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The downloaded wheels install and the MCP server lists its tools
        run: |
          ls -l dist
          test "$(ls dist/*.whl | wc -l)" = 2 && test "$(ls dist/*.tar.gz | wc -l)" = 2
          python -m pip install twine && python -m twine check dist/*
          python -m pip install --find-links dist grokmap-mcp
          python -c "import asyncio; from grokmap.mcp_server import server; print(len(asyncio.run(server.list_tools())), 'tools')"

  vscode:
    # the VS Code extension: unit tests, an end-to-end test against the real CLI, and the .vsix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install ../..
      - run: python ../../scripts/make_demo.py "$RUNNER_TEMP/demo" --with-ledger
      - run: npm ci
      - run: npm test
        env:
          GROKMAP_TEST_REPO: ${{ runner.temp }}/demo
          GROKMAP_TEST_FILE: src/shopcart/payments/client.py
      - run: npx vsce package --no-dependencies -o grokmap.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grokmap-vscode
          path: editors/vscode/grokmap.vsix
