[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "grokmap"
version = "0.5.0"
description = "Measure comprehension debt: the AI-written code in your repo that nobody understands."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "K. L. Aadithya" }]
keywords = ["mcp", "mcp-server", "ai", "claude-code", "codex", "copilot", "code-review", "comprehension-debt", "git", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Aadithya-kl/grokmap"
Issues = "https://github.com/Aadithya-kl/grokmap/issues"

[project.scripts]
grokmap = "grokmap.cli:main"
grokmap-mcp = "grokmap.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "ruff>=0.6", "mcp>=2.3,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/grokmap"]

[tool.hatch.build.targets.sdist]
include = ["src/grokmap", "tests", "skills", "README.md", "LICENSE", "action.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
