name: grokmap
description: Measure comprehension debt (AI-written code nobody has shown they understand), publish the heatmap, and optionally fail above a limit.
author: K. L. Aadithya
branding:
  icon: map
  color: red

inputs:
  max-debt:
    description: Fail when comprehension debt (%) is above this. Leave empty to only report.
    required: false
    default: ""
  critical:
    description: Set to "true" to check only the paths listed as critical in .grokmap.toml.
    required: false
    default: "false"
  report:
    description: Upload the HTML heatmap as a workflow artifact.
    required: false
    default: "true"
  comment:
    description: "On pull requests, post (and keep updating) one comment with the AI-written lines the PR adds and how many are understood. Needs the pull-requests write permission."
    required: false
    default: "true"
  max-unread:
    description: On pull requests, fail when the PR adds more than this many AI-written lines nobody has checked. Leave empty to only report.
    required: false
    default: ""
  github-token:
    description: Token used to post the PR comment.
    required: false
    default: ${{ github.token }}
  working-directory:
    description: Folder inside the repository to run in.
    required: false
    default: "."

outputs:
  debt:
    description: Comprehension debt in percent.
    value: ${{ steps.measure.outputs.debt }}
  ai-lines:
    description: Number of AI-written lines at HEAD.
    value: ${{ steps.measure.outputs.ai_lines }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install grokmap
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Check history depth
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::warning title=grokmap::Shallow clone: blame stops at the clone boundary, so authorship is incomplete. Use actions/checkout with fetch-depth: 0."
        fi

    - name: Measure
      id: measure
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        grokmap status --markdown --top 10 >> "$GITHUB_STEP_SUMMARY"
        grokmap status --json > "$RUNNER_TEMP/grokmap.json"
        python - "$RUNNER_TEMP/grokmap.json" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        t = json.load(open(sys.argv[1]))["total"]
        print(f"debt={t['debt_pct']}")
        print(f"ai_lines={t['ai']}")
        PY
        grokmap report -o "$RUNNER_TEMP/grokmap-report/index.html"

    - name: Upload heatmap
      if: inputs.report == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: grokmap-report
        path: ${{ runner.temp }}/grokmap-report/index.html

    - name: Summarize the pull request
      id: pr
      if: github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE: ${{ github.base_ref }}
      run: |
        git rev-parse --verify -q "origin/$BASE" >/dev/null || git fetch --quiet origin "$BASE:refs/remotes/origin/$BASE"
        grokmap diff --base "origin/$BASE" --markdown > "$RUNNER_TEMP/grokmap-pr.md"
        cat "$RUNNER_TEMP/grokmap-pr.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on the pull request
      if: github.event_name == 'pull_request' && inputs.comment == 'true' && steps.pr.outcome == 'success'
      continue-on-error: true  # forks get a read-only token; the job summary still has the table
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        marker='<!-- grokmap:pr-summary -->'
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
              --jq ".[] | select((.body // \"\") | startswith(\"$marker\")) | .id" | head -n 1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/grokmap-pr.md" > /dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/grokmap-pr.md" > /dev/null
        fi

    - name: Enforce PR limit
      if: github.event_name == 'pull_request' && inputs.max-unread != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE: ${{ github.base_ref }}
      run: grokmap diff --base "origin/$BASE" --max-unread "${{ inputs.max-unread }}"

    - name: Enforce limit
      if: inputs.max-debt != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        args=(--max-debt "${{ inputs.max-debt }}")
        if [ "${{ inputs.critical }}" = "true" ]; then args+=(--critical); fi
        grokmap check "${args[@]}"
